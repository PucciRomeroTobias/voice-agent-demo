[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-demo"
version = "0.1.0"
description = "Agente de voz bilingüe para la demo pública"
requires-python = ">=3.10, <3.15"
dependencies = [
  "livekit-agents[openai]>=1.6.9,<2",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
